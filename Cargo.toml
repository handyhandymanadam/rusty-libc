[workspace]
resolver = "3"
members = ["crates/rusty-libc-mem", "crates/rusty-libc-core", "crates/rusty-libc-malloc", "crates/rusty-libc-stdio", "crates/rusty-libc-ctype", "crates/rusty-libc-stdlib", "crates/rusty-libc-math", "crates/rusty-libc-sys", "crates/rusty-libc-util", "crates/rusty-libc-time", "crates/rusty-libc-wchar", "crates/rusty-libc-regex", "crates/rusty-libc-pthread", "crates/rusty-libc-signal", "crates/rusty-libc-net", "crates/rusty-libc-iconv", "crates/rusty-libc-fortify", "crates/rusty-libc-locale", "crates/rusty-libc-extra", "crates/rusty-libc-ipc", "crates/rusty-libc-rpc", "crates/rusty-libc-cabi", "crates/rusty-libc-rs", "crates/rusty-libc-rs-core"]
# tests/rust-hello is a separate no_std program built by the Makefile against the sysroot.
exclude = ["tests/rust-hello", "crates/rusty-libc-ldso", "crates/rusty-libc-mvec"]

[workspace.package]
edition = "2024"
license = "MIT"

[profile.dev]
panic = "abort"

# rusty-libc-math's fixed-point and 128-bit integer kernels rely on wrapping arithmetic and on optimized floating-point
# code (exact results must not raise spurious flags); they are tested and shipped in release mode. Build them
# like release in dev/test so the debug-build checks stay useful for the other crates.
[profile.dev.package.rusty-libc-math]
opt-level = 3
overflow-checks = false
debug-assertions = false

[profile.release]
panic = "abort"
opt-level = 3

# The static C runtime (make sysroot) is built with one codegen unit per function in most crates, so that
# a program that uses `exit` links `exit` and not the 8 MB of everything that shared its object (hello:
# 8.5 MB -> 0.25 MB). The hot crates keep 16 units: with one function per unit the cross-function calls
# inside the printf engine and the string/malloc/math kernels are not inlined (snprintf %s 1.44x slower,
# measured 2026-10-05; see STATE). libc.so.6 (tools/build-shared.sh) links whole archives and keeps release.
[profile.rt]
inherits = "release"
codegen-units = 256
[profile.rt.package.rusty-libc-stdio]
codegen-units = 16
[profile.rt.package.rusty-libc-math]
codegen-units = 16
[profile.rt.package.rusty-libc-mem]
codegen-units = 16
[profile.rt.package.rusty-libc-malloc]
codegen-units = 16
[profile.rt.package.rusty-libc-core]
codegen-units = 16
[profile.rt.package.rusty-libc-locale]
codegen-units = 256
# Static programs link a library object whole for one symbol it defines. rusty-libc-locale holds the collation code that fnmatch,
# glob and regcomp need (coll, collate) next to gettext, catgets and the charset glue that pulls in all of rusty-libc-iconv's tables
# (6 MB): one object per function keeps a pattern-matching program from carrying them.
[profile.release.package.rusty-libc-locale]
codegen-units = 256
