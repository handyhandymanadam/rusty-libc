[package]
name = "rusty-libc-stdio"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
rusty-libc-core = { path = "../rusty-libc-core" }
rusty-libc-mem = { path = "../rusty-libc-mem" }
rusty-libc-malloc = { path = "../rusty-libc-malloc" }
rusty-libc-wchar = { path = "../rusty-libc-wchar" }
rusty-libc-iconv = { path = "../rusty-libc-iconv" }

[dev-dependencies]
libc = "0.2"
rusty-libc-malloc = { path = "../rusty-libc-malloc", features = ["no-brk"] }

[features]
# Export the C symbols (printf, fopen, ...). Off for host tests so they never replace the host libc.
export = []
