[package]
name = "rusty-libc-mvec"
version = "0.0.0"
edition = "2024"
license = "MIT"

# Built by tools/build-shared.sh (staticlib, then linked by ld into libmvec.so.1 against our libc.so.6); not a workspace member:
# it is a no_std library with its own panic handler.
[workspace]

[lib]
crate-type = ["staticlib"]
test = false
doctest = false

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = 2
debug = false
