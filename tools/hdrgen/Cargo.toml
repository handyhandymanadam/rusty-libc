[package]
name = "hdrgen"
version = "0.1.0"
edition = "2021"
publish = false
license = "LGPL-2.1-or-later"

[workspace]

[dependencies]
cbindgen = { version = "=0.29.4", default-features = false }
regex-lite = "0.1"
serde_json = "1"
syn = { version = "2", default-features = false, features = ["full", "parsing"] }

[profile.release]
opt-level = 1
