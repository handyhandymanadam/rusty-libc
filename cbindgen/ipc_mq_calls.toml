language = "C"
style = "tag"
include_guard = "_RLIBC_IPC_MQ_CALLS_DECLS_H"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h"]
# Included by tools/hdrgen/src/hdr/mqueue.h, which has the types by hand; only the function declarations are
# generated here.
[export]
item_types = ["functions"]
[export.rename]
"MqAttr" = "struct mq_attr"
"SigEvent" = "struct sigevent"
"Timespec" = "struct timespec"
