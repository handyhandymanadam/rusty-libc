language = "C"
include_guard = "_RLIBC_UCHAR_H"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
after_includes = """
#define __need_wint_t
#include <stddef.h>
#undef __need_wint_t
#ifndef ____mbstate_t_defined
#define ____mbstate_t_defined 1
typedef struct { int __count; union { wint_t __wch; char __wchb[4]; } __value; } __mbstate_t;
#endif
#ifndef __mbstate_t_defined
#define __mbstate_t_defined 1
typedef __mbstate_t mbstate_t;
#endif
#if !defined _BITS_TYPES_LOCALE_T_H && !defined _RLIBC_LOCALE_T
#define _BITS_TYPES_LOCALE_T_H 1
#define _RLIBC_LOCALE_T
typedef struct __locale_struct *__locale_t;
typedef __locale_t locale_t;
#endif

#ifndef __cplusplus
typedef __UINT_LEAST16_TYPE__ char16_t;
typedef __UINT_LEAST32_TYPE__ char32_t;
#endif
#if !defined __cpp_char8_t && (defined _GNU_SOURCE || (defined __STDC_VERSION__ && __STDC_VERSION__ > 201710L))
typedef unsigned char char8_t;
#endif
"""
