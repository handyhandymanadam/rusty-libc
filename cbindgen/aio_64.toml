language = "C"
style = "tag"
include_guard = "_RLIBC_AIO_64_DECLS_H"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h"]
# Included by tools/hdrgen/src/hdr/aio.h, which has the types and constants by hand; only the function
# declarations are generated here.
[export]
item_types = ["functions"]
[export.rename]
"Aiocb" = "struct aiocb"
"Aiocb64" = "struct aiocb64"
"SigEvent" = "struct sigevent"
"Timespec" = "struct timespec"
"AioInit" = "struct aioinit"
