language = "C"
style = "tag"
include_guard = "_RLIBC_IPC_SHM_DECLS_H"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h"]
# Included by tools/hdrgen/src/hdr/sys/*.h, which have the types, constants and macros by hand; only the
# function declarations are generated here.
[export]
item_types = ["functions"]
[export.rename]
"MsqidDs" = "struct msqid_ds"
"SemidDs" = "struct semid_ds"
"ShmidDs" = "struct shmid_ds"
"Sembuf" = "struct sembuf"
"Timespec" = "struct timespec"
