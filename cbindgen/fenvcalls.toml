language = "C"
include_guard = "_RLIBC_FENV_CALLS_H"
no_includes = true
# Included by tools/hdrgen/src/hdr/fenv.h after it has defined fexcept_t, fenv_t, femode_t and the
# FE_* constants (by hand, in glibc's layout; the test tests/c/math_diff.c checks them against
# the Rust constants and glibc's header).
[defines]
"feature = gnu" = "__RLIBC_MATH_GNU"
"feature = ext" = "__RLIBC_MATH_EXT"
[export]
exclude = ["FE_INVALID", "FE_DENORM", "FE_DIVBYZERO", "FE_OVERFLOW", "FE_UNDERFLOW", "FE_INEXACT", "FE_ALL_EXCEPT", "FE_TONEAREST", "FE_DOWNWARD", "FE_UPWARD", "FE_TOWARDZERO", "FenvT", "FemodeT", "FexceptT"]
[export.rename]
"FenvT" = "fenv_t"
"FemodeT" = "femode_t"
"FexceptT" = "fexcept_t"
